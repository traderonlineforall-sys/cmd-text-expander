name: Build chrome

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build portable app
        shell: cmd
        run: build.bat

      - name: Normalize executable name
        shell: powershell
        run: |
          if (Test-Path "publish\chrome.exe") {
            Write-Host "chrome.exe already exists."
          } elseif (Test-Path "publish\cmd.exe") {
            Copy-Item "publish\cmd.exe" "publish\chrome.exe" -Force
            Write-Host "Copied publish\cmd.exe to publish\chrome.exe for release naming."
          } else {
            Get-ChildItem -Recurse publish -ErrorAction SilentlyContinue | Format-Table FullName, Length
            throw "Neither publish\chrome.exe nor publish\cmd.exe was created"
          }

      - name: Validate Windows executable
        shell: powershell
        run: |
          if (!(Test-Path "publish\chrome.exe")) { throw "publish\chrome.exe was not created" }
          $bytes = [System.IO.File]::ReadAllBytes("publish\chrome.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a Windows EXE: missing MZ header" }
          Write-Host "Valid Windows EXE MZ header found"

      - name: Prepare artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "publish\chrome.exe" "artifact\chrome.exe" -Force
          if (Test-Path "README.md") { Copy-Item "README.md" "artifact\README.md" -Force }
          if (Test-Path "snippets.json") { Copy-Item "snippets.json" "artifact\snippets.json" -Force }
          $readme = @(
            "chrome Text Expander",
            "",
            "Run chrome.exe.",
            "Use keyword + Space / Enter / Tab, or Ctrl + Space.",
            "Keep snippets.json next to chrome.exe."
          )
          $readme | Set-Content -Path "artifact\README_RUN_FIRST.txt" -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome_v20_final_smart_engine_release
          path: artifact/*
          if-no-files-found: error
