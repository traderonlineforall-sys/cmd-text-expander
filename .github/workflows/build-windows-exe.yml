name: Build cmd

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build accepted cmd app
        shell: cmd
        run: build.bat

      - name: Validate cmd executable
        shell: powershell
        run: |
          if (!(Test-Path "publish\cmd.exe")) { throw "publish\cmd.exe was not created" }
          $bytes = [System.IO.File]::ReadAllBytes("publish\cmd.exe")
          if ($bytes.Length -lt 2) { throw "publish\cmd.exe is empty or corrupt" }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a Windows EXE: missing MZ header" }
          $hash = Get-FileHash "publish\cmd.exe" -Algorithm SHA256
          Write-Host "Valid Windows EXE found: publish\cmd.exe"
          Write-Host "SHA256: $($hash.Hash)"
          $hash.Hash | Set-Content -Path "publish\cmd.exe.sha256" -Encoding ASCII

      - name: Prepare artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "publish\cmd.exe" "artifact\cmd.exe" -Force
          Copy-Item "publish\cmd.exe.sha256" "artifact\cmd.exe.sha256" -Force
          if (Test-Path "snippets.json") { Copy-Item "snippets.json" "artifact\snippets.json" -Force }
          if (Test-Path "README.md") { Copy-Item "README.md" "artifact\README.md" -Force }
          $readme = @(
            "cmd Text Expander - accepted build",
            "",
            "Run cmd.exe.",
            "Keep snippets.json next to cmd.exe.",
            "Automatic mode expands with keyword + Space / Enter / Tab.",
            "Manual mode expands with Ctrl + Space."
          )
          $readme | Set-Content -Path "artifact\README_RUN_FIRST.txt" -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmd_final_release
          path: artifact/*
          if-no-files-found: error
