name: Build cmd accepted smart engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build cmd.exe
        shell: cmd
        run: build.bat

      - name: Validate Windows executable
        shell: powershell
        run: |
          if (!(Test-Path "publish\cmd.exe")) { throw "publish\cmd.exe was not created" }
          $bytes = [System.IO.File]::ReadAllBytes("publish\cmd.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a Windows EXE: missing MZ header" }
          Write-Host "Valid Windows EXE MZ header found"

      - name: Prepare artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "publish\cmd.exe" "artifact\cmd.exe" -Force
          Copy-Item "snippets.json" "artifact\snippets.json" -Force
          Copy-Item "README.md" "artifact\README.md" -Force
          $readme = @(
            "cmd accepted-base smart engine",
            "",
            "Run cmd.exe.",
            "Default mode: Automatic. Use keyword + Space/Enter/Tab, or switch to Ctrl + Space from the app.",
            "Keep snippets.json next to cmd.exe."
          )
          $readme | Set-Content -Path "artifact\README_RUN_FIRST.txt" -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmd_final_release
          path: artifact/*
          if-no-files-found: error
