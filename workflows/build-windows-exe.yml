name: Build chrome Text Expander v21

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build chrome
        shell: cmd
        run: build.bat

      - name: Validate executable
        shell: powershell
        run: |
          if (!(Test-Path "publish\chrome.exe")) { throw "publish\chrome.exe was not created" }
          $bytes = [System.IO.File]::ReadAllBytes("publish\chrome.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid EXE header" }
          Write-Host "Valid chrome.exe created"

      - name: Prepare artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "publish\chrome.exe" "artifact\chrome.exe"
          Copy-Item "snippets.json" "artifact\snippets.json"
          Copy-Item "README.md" "artifact\README.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome_v21_independent_beeftext_logic_release
          path: artifact/*
          if-no-files-found: error
