name: Build cmd Text Expander

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up MSVC
        uses: microsoft/setup-msbuild@v1.1
        with:
          vs-version: 'latest'
      - name: Build
        shell: cmd
        run: |
          cd cmd_final
          build.bat
      - name: Package artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp -a cmd_final/publish/cmd.exe artifact/
          cp -a cmd_final/README.md artifact/
          cp -a cmd_final/snippets.json artifact/
          cp -a cmd_final/build.bat artifact/
          # Create zip
          cd artifact
          zip -r9 ../cmd_text_expander_release.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: cmd_text_expander_release
          path: cmd_text_expander_release.zip