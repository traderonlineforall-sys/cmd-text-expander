name: Build cmd Beeftext Logic Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package portable app
        shell: cmd
        run: build.bat

      - name: Prepare zip artifact
        shell: powershell
        run: |
          if (!(Test-Path "publish\cmd.exe")) { throw "publish\cmd.exe was not created" }
          Compress-Archive -Path "publish\*" -DestinationPath "cmd_beeftext_logic_release.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmd_beeftext_logic_release
          path: cmd_beeftext_logic_release.zip
          if-no-files-found: error
